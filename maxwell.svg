  <line x1="256" y1="282" x2="256" y2="428" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.75"/>
  <circle cx="256" cy="256" r="26" stroke="#E2E8F0" stroke-width="6.5"/>
  <circle cx="256" cy="256" r="9.5" fill="#38BDF8"/>
</svg>
