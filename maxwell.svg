<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <rect width="512" height="512" fill="#000000"/>
  <defs>
    <linearGradient id="mx-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="mx-ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <!-- Left conjecture input loops -->
  <path d="M 96 256 C 96 156, 188 148, 240 220" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 96 256 C 96 356, 188 364, 240 292" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <line x1="96" y1="256" x2="232" y2="256" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>

  <!-- Left nodes -->
  <circle cx="96" cy="256" r="18" fill="#000000" stroke="#F8FAFC" stroke-width="6"/>
  <circle cx="96" cy="256" r="6" fill="#7DD3FC"/>
  <circle cx="140" cy="184" r="9" fill="#000000" stroke="#94A3B8" stroke-width="5"/>
  <circle cx="140" cy="328" r="9" fill="#000000" stroke="#94A3B8" stroke-width="5"/>

  <!-- Right sorted / certified trajectories -->
  <path d="M 272 236 C 316 236, 336 132, 396 124" stroke="url(#mx-ice)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 272 246 C 324 246, 344 190, 422 184" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round"/>
  <path d="M 272 256 L 380 256" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>
  <path d="M 272 266 C 324 266, 344 322, 422 328" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round"/>
  <path d="M 272 276 C 316 276, 336 380, 396 388" stroke="url(#mx-ice)" stroke-width="6" stroke-linecap="round"/>

  <!-- Right certified nodes -->
  <circle cx="396" cy="124" r="15" fill="#000000" stroke="#7DD3FC" stroke-width="6"/>
  <circle cx="422" cy="184" r="20" fill="#F8FAFC"/>
  <circle cx="384" cy="256" r="7" fill="#64748B"/>
  <circle cx="422" cy="328" r="20" fill="#F8FAFC"/>
  <circle cx="396" cy="388" r="15" fill="#000000" stroke="#7DD3FC" stroke-width="6"/>

  <!-- Central Maxwell Gate (biconvex spindle + aperture ring) -->
  <path d="M 256 68 C 282 148, 282 364, 256 444 C 230 364, 230 148, 256 68 Z" fill="#000000" stroke="url(#mx-metal)" stroke-width="6" stroke-linejoin="round"/>
  <line x1="256" y1="84" x2="256" y2="428" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.65"/>
  <circle cx="256" cy="256" r="26" fill="#000000" stroke="#F8FAFC" stroke-width="6"/>
  <circle cx="256" cy="256" r="9" fill="#7DD3FC"/>
</svg>
